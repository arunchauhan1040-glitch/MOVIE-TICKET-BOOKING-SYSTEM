<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20242b}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.box{stroke:#596273;stroke-width:1.5}.line{stroke:#4b5563;stroke-width:1.6;fill:none}.dash{stroke-dasharray:7 6}.accent{fill:#eef2ff}.pink{fill:#fce7f3}.green{fill:#ecfdf5}.orange{fill:#fff7ed}.blue{fill:#eff6ff}.purple{fill:#f5f3ff}.yellow{fill:#fefce8}</style></defs>
<rect width="1600" height="980" fill="#f8fafc"/>
<rect x="20" y="20" width="760" height="940" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<rect x="820" y="20" width="760" height="940" rx="12" fill="white" stroke="#64748b" stroke-width="2"/>
<rect x="270" y="35" width="260" height="48" rx="12" class="accent" stroke="#93a3c6"/>
<text x="400" y="67" text-anchor="middle" class="title">CLASS DIAGRAM</text>
<rect x="1060" y="35" width="260" height="48" rx="12" class="accent" stroke="#93a3c6"/>
<text x="1190" y="67" text-anchor="middle" class="title">SEQUENCE DIAGRAM</text>

<!-- Class boxes -->
<g class="box">
<rect x="45" y="115" width="190" height="135" class="purple"/><text x="140" y="140" text-anchor="middle" class="head">Cinema</text><line x1="45" y1="150" x2="235" y2="150" class="line"/><text x="57" y="173" class="body">- name : string</text><text x="57" y="202" class="body">+ addScreen(s)</text><text x="57" y="223" class="body">+ getScreens()</text><text x="57" y="244" class="body">+ getName()</text>
<rect x="285" y="115" width="210" height="150" class="orange"/><text x="390" y="140" text-anchor="middle" class="head">Screen</text><line x1="285" y1="150" x2="495" y2="150" class="line"/><text x="297" y="173" class="body">- screenNo : int</text><text x="297" y="194" class="body">- seats : vector&lt;Seat&gt;</text><text x="297" y="224" class="body">+ addSeat(s)</text><text x="297" y="245" class="body">+ getSeats()</text>
<rect x="550" y="115" width="190" height="150" class="green"/><text x="645" y="140" text-anchor="middle" class="head">Seat</text><line x1="550" y1="150" x2="740" y2="150" class="line"/><text x="562" y="173" class="body">- seatNo : string</text><text x="562" y="194" class="body">- type : SeatType</text><text x="562" y="215" class="body">- price : double</text><text x="562" y="245" class="body">+ getPrice()</text>
<rect x="55" y="320" width="190" height="145" class="pink"/><text x="150" y="345" text-anchor="middle" class="head">Movie</text><line x1="55" y1="355" x2="245" y2="355" class="line"/><text x="67" y="378" class="body">- title : string</text><text x="67" y="399" class="body">- language : string</text><text x="67" y="420" class="body">- duration : int</text><text x="67" y="450" class="body">+ getTitle()</text>
<rect x="290" y="310" width="230" height="205" class="blue"/><text x="405" y="335" text-anchor="middle" class="head">Show</text><line x1="290" y1="345" x2="520" y2="345" class="line"/><text x="302" y="368" class="body">- showId : int</text><text x="302" y="389" class="body">- movie : Movie*</text><text x="302" y="410" class="body">- screen : Screen*</text><text x="302" y="431" class="body">- startTime : string</text><text x="302" y="452" class="body">- showSeats : vector&lt;ShowSeat&gt;</text><text x="302" y="483" class="body">+ getMovie() / getScreen()</text><text x="302" y="503" class="body">+ getShowSeats()</text>
<rect x="560" y="320" width="180" height="155" class="purple"/><text x="650" y="345" text-anchor="middle" class="head">ShowSeat</text><line x1="560" y1="355" x2="740" y2="355" class="line"/><text x="572" y="378" class="body">- seat : Seat*</text><text x="572" y="399" class="body">- status : Status</text><text x="572" y="430" class="body">+ isAvailable()</text><text x="572" y="451" class="body">+ book() / release()</text>
<rect x="50" y="560" width="185" height="145" class="green"/><text x="142" y="585" text-anchor="middle" class="head">Customer</text><line x1="50" y1="595" x2="235" y2="595" class="line"/><text x="62" y="618" class="body">- id : int</text><text x="62" y="639" class="body">- name : string</text><text x="62" y="660" class="body">- phone : string</text><text x="62" y="690" class="body">+ getName() / getPhone()</text>
<rect x="275" y="545" width="250" height="205" class="pink"/><text x="400" y="570" text-anchor="middle" class="head">Booking</text><line x1="275" y1="580" x2="525" y2="580" class="line"/><text x="287" y="603" class="body">- bookingId : int</text><text x="287" y="624" class="body">- customer : Customer*</text><text x="287" y="645" class="body">- show : Show*</text><text x="287" y="666" class="body">- seats : vector&lt;ShowSeat&gt;</text><text x="287" y="687" class="body">- totalAmount : double</text><text x="287" y="708" class="body">- status : BookingStatus</text><text x="287" y="730" class="body">+ getBookingId() / cancel()</text>
<rect x="570" y="545" width="180" height="120" class="orange"/><text x="660" y="570" text-anchor="middle" class="head">Payment</text><line x1="570" y1="580" x2="750" y2="580" class="line"/><text x="582" y="603" class="body">&lt;&lt;abstract&gt;&gt;</text><text x="582" y="624" class="body">+ pay(amount) : bool</text>
<rect x="540" y="700" width="90" height="75" class="blue"/><text x="585" y="725" text-anchor="middle" class="small">UPI</text><text x="585" y="747" text-anchor="middle" class="small">Payment</text><rect x="640" y="700" width="90" height="75" class="blue"/><text x="685" y="725" text-anchor="middle" class="small">Card</text><text x="685" y="747" text-anchor="middle" class="small">Payment</text><rect x="570" y="795" width="120" height="70" class="yellow"/><text x="630" y="823" text-anchor="middle" class="small">Cash</text><text x="630" y="844" text-anchor="middle" class="small">Payment</text>
<rect x="50" y="800" width="190" height="80" class="purple"/><text x="145" y="830" text-anchor="middle" class="head">PriceCalculator</text><text x="145" y="853" text-anchor="middle" class="small">+ calculate(seats)</text>
<rect x="270" y="800" width="190" height="80" class="blue"/><text x="365" y="830" text-anchor="middle" class="head">TicketPrinter</text><text x="365" y="853" text-anchor="middle" class="small">+ printTicket(booking)</text>
<rect x="490" y="805" width="255" height="100" class="pink"/><text x="617" y="830" text-anchor="middle" class="head">BookingService</text><text x="617" y="854" text-anchor="middle" class="small">+ bookTicket(...)</text><text x="617" y="874" text-anchor="middle" class="small">+ cancelBooking(id)</text>
</g>
<!-- class relationships -->
<path d="M235 182 L285 182" class="line"/><polygon points="235,182 250,174 250,190" fill="#1f2937"/><text x="247" y="168" class="small">1 contains 1..*</text>
<path d="M495 190 L550 190" class="line"/><polygon points="495,190 510,182 510,198" fill="#1f2937"/><text x="505" y="176" class="small">1 contains 1..*</text>
<path d="M245 395 L290 395" class="line"/><polygon points="245,395 260,387 260,403" fill="#1f2937"/><text x="247" y="382" class="small">has</text>
<path d="M405 265 L405 310" class="line"/><polygon points="405,265 397,280 413,280" fill="#1f2937"/>
<path d="M520 395 L560 395" class="line"/><polygon points="520,395 535,387 535,403" fill="#1f2937"/><text x="526" y="382" class="small">contains</text>
<path d="M235 630 L275 630" class="line"/><polygon points="235,630 250,622 250,638" fill="#1f2937"/><text x="240" y="618" class="small">makes</text>
<path d="M400 515 L400 545" class="line"/>
<path d="M525 630 L570 630" class="line dash"/><text x="532" y="618" class="small">uses</text>
<path d="M630 665 L585 700" class="line"/><polygon points="630,665 613,673 622,684" fill="none" stroke="#4b5563"/>
<path d="M660 665 L685 700" class="line"/><polygon points="660,665 668,681 677,673" fill="none" stroke="#4b5563"/>
<path d="M630 665 L630 795" class="line"/>
<path d="M400 750 L145 800" class="line dash"/><text x="235" y="773" class="small">uses</text><path d="M400 750 L365 800" class="line dash"/><text x="385" y="780" class="small">uses</text><path d="M525 700 L490 830" class="line dash"/>
<rect x="50" y="905" width="695" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="62" y="929" class="small">◆ Composition   ◇ Aggregation   — Association   △ Inheritance   1..* Multiplicity</text>

<!-- Sequence diagram -->
<rect x="850" y="105" width="700" height="44" rx="10" fill="#eef2ff" stroke="#c7d2fe"/><text x="1200" y="133" text-anchor="middle" class="head">Use Case: Customer books 1 seat and pays by UPI</text>
<g class="small">
<text x="880" y="185">Customer</text><text x="970" y="185">BookingService</text><text x="1080" y="185">Show</text><text x="1160" y="185">ShowSeat</text><text x="1260" y="185">PriceCalculator</text><text x="1390" y="185">Payment (UPI)</text><text x="1490" y="185">Booking</text>
</g>
<g class="line dash"><line x1="900" y1="195" x2="900" y2="690"/><line x1="1015" y1="195" x2="1015" y2="690"/><line x1="1110" y1="195" x2="1110" y2="690"/><line x1="1200" y1="195" x2="1200" y2="690"/><line x1="1320" y1="195" x2="1320" y2="690"/><line x1="1430" y1="195" x2="1430" y2="690"/><line x1="1510" y1="195" x2="1510" y2="690"/></g>
<g fill="#c7d2fe" stroke="#64748b"><rect x="1008" y="225" width="14" height="75"/><rect x="1193" y="330" width="14" height="60"/><rect x="1313" y="430" width="14" height="55"/><rect x="1423" y="520" width="14" height="55"/><rect x="1503" y="575" width="14" height="65"/></g>
<g class="small"><text x="910" y="220">1. selectShow()</text><text x="1030" y="265">2. getShow(showId)</text><text x="910" y="315">3. selectSeat(seatNo)</text><text x="1030" y="355">4. checkAvailability(seatNo)</text><text x="910" y="415">5. createBooking(customer, show, seat)</text><text x="1030" y="455">6. calculateAmount(seats)</text><text x="910" y="505">7. makePayment(amount)</text><text x="910" y="595">8. confirmBooking()</text><text x="910" y="655">9. printTicket(booking)</text></g>
<g class="line"><path d="M900 230 L1008 230"/><polygon points="1008,230 995,223 995,237" fill="#4b5563"/><path d="M1022 275 L1110 275"/><polygon points="1110,275 1097,268 1097,282" fill="#4b5563"/><path d="M900 325 L1193 325"/><polygon points="1193,325 1180,318 1180,332" fill="#4b5563"/><path d="M1207 370 L1015 370" class="dash"/><polygon points="1015,370 1028,363 1028,377" fill="#4b5563"/><path d="M1022 425 L1503 425"/><polygon points="1503,425 1490,418 1490,432" fill="#4b5563"/><path d="M1022 460 L1313 460"/><polygon points="1313,460 1300,453 1300,467" fill="#4b5563"/><path d="M1022 515 L1423 515"/><polygon points="1423,515 1410,508 1410,522" fill="#4b5563"/><path d="M1437 560 L1022 560" class="dash"/><polygon points="1022,560 1035,553 1035,567" fill="#4b5563"/><path d="M1022 590 L1503 590"/><polygon points="1503,590 1490,583 1490,597" fill="#4b5563"/><path d="M1517 650 L1022 650" class="dash"/><polygon points="1022,650 1035,643 1035,657" fill="#4b5563"/></g>
<rect x="850" y="705" width="700" height="150" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-dasharray="7 5"/><text x="875" y="735" class="head">Alternate Flow: Payment Fails</text><text x="875" y="765" class="small">7a. makePayment(amount) → paymentFailed</text><text x="875" y="795" class="small">7b. cancelTemporaryBooking() → status = FAILED</text><text x="875" y="825" class="small">7c. releaseSeat(seatNo) → seat becomes AVAILABLE</text>
<rect x="850" y="875" width="700" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="870" y="898" class="small">Notes: Solid arrows = requests • Dashed arrows = return messages • Activation bars = active object</text><text x="870" y="917" class="small">The diagram shows the main booking path and the payment-failure recovery path.</text>
</svg>
